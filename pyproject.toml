[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ue-knowledge-base"
version = "0.1.0"
description = "Offline semantic search over Unreal Engine development knowledge (BGE + ChromaDB)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dong" }]
keywords = ["unreal-engine", "rag", "semantic-search", "chromadb", "knowledge-base"]
dependencies = [
    "sentence-transformers>=2.6",
    # chromadb 1.x 的 Rust 后端无法重新加载自己构建的 HNSW 索引
    # （Error loading hnsw index），pin 在 0.x 稳定后端
    "chromadb>=0.5,<1.0",
    # transformers 5.x + tokenizers 0.23.1 组合在运行时
    # require_version 检查会失败（pip 元数据解析却通过），pin 到 4.x
    "transformers>=4.40,<5",
    "tokenizers>=0.22,<0.23",
]

[project.scripts]
ue-kb = "ue_knowledge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
