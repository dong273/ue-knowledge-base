name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Windows coverage guards the platform-specific failure class (hnswlib
    # cannot open index files under non-ASCII paths, console-script behavior).
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Unit tests (chunking + CLI + default paths)
        env:
          UE_KB_EXPECT_PACKAGE_MODE: source
        run: pip install pytest && python -m pytest tests/ -v
      - name: Doctor source identity
        env:
          UE_KB_EXPECT_PACKAGE_MODE: source
        run: python scripts/check_doctor_identity.py

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build
      - name: Release gate — corpus in artifact == source corpus
        run: python scripts/verify_package.py dist/*.whl dist/*.tar.gz
      - name: Public publication manifest
        run: python scripts/check_publication_manifest.py
      - name: Provenance coverage contract (pending entries stay non-release)
        run: |
          PYTHONPATH=src python -m ue_knowledge.cli audit-corpus --scope public --allow-pending --json > provenance-audit.json
          python -c "import json; d=json.load(open('provenance-audit.json', encoding='utf-8')); assert d['schema_version'] == 1; assert d['documents'] == d['covered'] == 90, d; assert d['working_ready'] is True, d; assert 'blocking_issue_count' in d and 'claim_summary' in d, d; print('provenance contract:', d['covered'], 'covered,', d['verified'], 'verified')"
      - name: UE evidence manifest contract
        run: python scripts/check_ue57_evidence.py validation/fixtures/ue57-validation-evidence.json --fixture-registry validation/fixture-registry.json --claim-ledger validation/corpus-audit.json
      - name: Fresh venv, install from wheel only
        run: |
          python -m venv fresh
          fresh/bin/pip install dist/*.whl
          fresh/bin/pip install pytest
      - name: Installed-wheel suite (default corpus + new-process round trip)
        env:
          UE_KB_EXPECT_PACKAGE_MODE: wheel
        run: fresh/bin/python -m pytest tests/ -v
      - name: Doctor wheel identity
        env:
          UE_KB_EXPECT_PACKAGE_MODE: wheel
        run: fresh/bin/python scripts/check_doctor_identity.py

  smoke:
    # Install-from-wheel smoke test: what a user gets from PyPI must build a
    # real index and return hits. This catches the "corpus missing from the
    # published wheel" regression class (see 0.4.0, whose PyPI wheel shipped
    # no knowledge/ corpus and could not build an index at all).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build
      - name: Release gate — corpus in artifact == source corpus
        run: python scripts/verify_package.py dist/*.whl dist/*.tar.gz
      - name: Fresh venv, install from wheel only
        run: |
          python -m venv fresh
          fresh/bin/pip install dist/*.whl
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bge-small-en-v1.5-${{ runner.os }}
      - name: Download default model
        run: fresh/bin/ue-kb download-model --json
      - name: Build index from the wheel's bundled corpus
        run: fresh/bin/ue-kb build --db .smoke-index --json
      - name: MCP stdio doctor and query smoke
        run: |
          fresh/bin/ue-kb doctor --db .smoke-index --json --mcp-smoke --mcp-smoke-query "GAS ability cooldown" \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'], d; assert d['mcp']['query_ok'], d['mcp']; print('MCP smoke ok:', d['mcp']['tools'])"
      - name: Query returns hits
        run: fresh/bin/ue-kb query --db .smoke-index "GAS ability cooldown" --top-k 5 --json | grep -q '"source":'
      - name: MCP resident timing smoke
        run: fresh/bin/python scripts/measure_mcp.py --db .smoke-index --model BAAI/bge-small-en-v1.5 --output mcp-timing-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-timing-report
          path: mcp-timing-report.json
      - name: Corpus shipped intact (chunk count sanity)
        run: |
          fresh/bin/ue-kb info --db .smoke-index --json | python -c "import json,sys; d=json.load(sys.stdin); assert d['manifest']['corpus']['documents'] == 90, d; assert d['documents'] == d['manifest']['corpus']['chunks'], d; print('corpus ok:', d['manifest']['corpus'])"

  privacy:
    # The corpus ships inside the published wheel: personal paths, private
    # project names or agent-prompt leftovers would reach every user.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Corpus privacy scan
        run: python scripts/check_privacy.py
      - name: zh_dict concepts grounded in corpus vocabulary
        run: python scripts/check_zh_dict.py

  quality:
    # Quality evaluation uses the cached ~100MB default model. It is kept as a
    # separate release gate so ordinary unit-test failures stay fast to debug.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bge-small-en-v1.5-${{ runner.os }}
      - name: Download default model
        run: ue-kb download-model --json
      - name: Held-out quality, latency and size gates
        run: python scripts/evaluate_retrieval.py --db /tmp/uekb-quality --build --output quality-report.json
      - name: Coverage and abstention regression dataset
        run: python scripts/evaluate_coverage.py --db /tmp/uekb-quality --output coverage-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-quality-report
          path: quality-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-abstention-report
          path: coverage-report.json
