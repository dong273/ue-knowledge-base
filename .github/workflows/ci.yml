name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Unit tests (chunking + CLI + default paths)
        run: pip install pytest && pytest tests/ -v

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build
      - name: Release gate — corpus in artifact == source corpus
        run: python scripts/verify_package.py dist/*.whl dist/*.tar.gz
      - name: Fresh venv, install from wheel only
        run: |
          python -m venv fresh
          fresh/bin/pip install dist/*.whl
          fresh/bin/pip install pytest
      - name: Installed-wheel suite (default corpus + new-process round trip)
        run: fresh/bin/python -m pytest tests/ -v

  quality:
    # Quality evaluation uses the cached ~100MB default model. It is kept as a
    # separate release gate so ordinary unit-test failures stay fast to debug.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bge-small-en-v1.5-${{ runner.os }}
      - name: Download default model
        run: ue-kb download-model --json
      - name: Held-out quality, latency and size gates
        run: python scripts/evaluate_retrieval.py --db /tmp/uekb-quality --build --output quality-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-quality-report
          path: quality-report.json
